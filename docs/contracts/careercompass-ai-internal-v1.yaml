openapi: 3.0.3

info:
  title: CareerCompass AI Internal API
  version: 1.2.0
  description: |
    The **internal** service-to-service contract between the Java (Spring Boot) backend and the
    Python (FastAPI) AI/data-analysis service.

    This is the authoritative contract. It supersedes `docs/contracts/AI_SERVICE_CONTRACT.docx`,
    which described Java's DTOs rather than an agreed wire format and is retained only as history.

    ## Rules this contract encodes

    * **`Java public API != Python internal API`.** Nothing here is reachable from a browser.
      The Java backend is the only client. It maps every payload at its own adapter so that
      Python's `snake_case` shapes never leak into Java domain or public DTOs.
    * **Naming.** JSON is `snake_case` throughout. Base path is `/api/v1`.
    * **Scales.** Every proficiency, coverage, gap, readiness and relevance value is a decimal
      in `0.0..1.0`. Java converts to `0..100` only at its presentation edge. A percentage sent
      here is a contract violation, not a rounding difference.
    * **Enums.** Classifications are lower-case: `strong`, `moderate`, `weak`.
    * **Ownership.** Python computes; it is not the system of record. It holds no users, no
      transcripts and no quiz attempts. The caller supplies confirmed data on every request and
      persists whatever it needs from the response.
    * **Errors.** Every error is RFC 9457 `application/problem+json`.

    ## Scope of v1

    In scope: transcript parsing (M1), skill vector (M2), skill gap (M3), course
    recommendations (M4), quiz generation (M5), mentor matching (M6), and the
    proposal/review/publication boundary for syllabus maps (M8).

    Mentor matching was added in **v1.1.0** (ADR-008, superseding ADR-005's deferral). Purely
    additive: every v1.0.0 request and response remains valid.

    **Still out of scope by owner decision:** job matching. `/api/v1/job-matches/*` is
    deliberately absent rather than unimplemented; adding it is a further additive change.

    ## Known deferrals

    These are recorded so they are not mistaken for oversights. Each is additive and therefore
    a minor-version change when it lands:

    * `career_path` is keyed by **name**, not by an immutable `career_path_code`. Java career
      paths are administrator-created free text, so the adapter is responsible for sending a
      name this service knows; unknown names get a controlled `404 career-path-not-found`
      listing the names that exist. An immutable code is deferred to v1.1.
    * The skill vector carries `taxonomy_version` but no `vector_version` document identity.
      Downstream operations therefore recompute the vector from the supplied courses rather
      than referencing one stored artefact. Deferred to v1.1.
    * Opaque cross-service ids for students/jobs/mentors are not required by any v1 operation,
      because no v1 operation is student-scoped. They land with job matching.

servers:
  - url: http://localhost:8000
    description: Local development. Plain HTTP is permitted only on loopback.
  - url: https://ai.careercompass.internal
    description: Deployed. TLS and network policy are mandatory.

security:
  - serviceToken: []

tags:
  - name: health
    description: Liveness and readiness, used by the caller's startup diagnostics.
  - name: transcript
    description: M1 — transcript parsing.
  - name: skill-gap
    description: M2/M3 — skill vector and gap.
  - name: recommendations
    description: M4 — grounded course retrieval.
  - name: quiz
    description: M5 — quiz generation.
  - name: syllabus
    description: M8 — proposal-only syllabus extraction jobs.
  - name: taxonomy
    description: Canonical skill lookup for reviewed additions and replacements.
  - name: course-maps
    description: Idempotent publication of Java-approved course maps.

paths:

  /api/v1/health/live:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/v1/health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Reports whether the artefacts each module needs are actually loaded. The caller should
        surface this in its own startup diagnostics so that "AI unavailable" is visible before a
        student triggers it, not after.
      security: []
      responses:
        '200':
          description: Readiness detail. `ready:false` still answers 200; read the field.
          content:
            application/json:
              schema:
                type: object
                required: [ready, checks]
                properties:
                  ready: { type: boolean }
                  checks:
                    type: object
                    additionalProperties:
                      type: object

  /api/v1/transcripts/parse:
    post:
      tags: [transcript]
      operationId: parseTranscript
      summary: Parse a transcript PDF into reviewable course rows (M1)
      description: |
        **Budget: 30 s** (NFR-PERF-02). Synchronous.

        The caller uploads the PDF as `multipart/form-data` and receives typed rows. It is the
        caller's job to show those rows for review and correction, and to persist only what the
        student confirms.

        `save` must be `false` from the Java backend: Python is not the system of record for a
        student's transcript. `save=true` exists for local CLI work only.

        Read `courses` — the canonical typed rows. `all_courses` is a legacy untyped view kept
        during migration and will be removed in v2; new callers must not bind to it.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The transcript PDF. Max 10 MB, `application/pdf`.
                save:
                  type: boolean
                  default: false
                  description: Must be false for service-to-service calls.
      responses:
        '200':
          description: Parsed transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptParseResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/extractions:
    post:
      tags: [syllabus]
      operationId: submitSyllabusExtraction
      summary: Queue a syllabus extraction proposal (M8)
      description: |
        Java sends `store=false`: this result is a proposal and must not write either the
        published JSON course map or PostgreSQL `course_skills`. Human-reviewed publication is
        a separate `PUT /api/v1/course-maps/{course_map_version}` operation.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Text-based course syllabus PDF.
                use_llm: { type: boolean, default: false }
                force: { type: boolean, default: false }
                store:
                  type: boolean
                  default: false
                  description: Must be false for review-first Java submissions.
      responses:
        '200':
          description: Idempotency cache returned an already successful proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyllabusExtractionResponse' }
        '202':
          description: Extraction queued. Poll the Location resource.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyllabusExtractionResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/extractions/{extraction_id}:
    parameters:
      - name: extraction_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 120 }
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [syllabus]
      operationId: getSyllabusExtraction
      summary: Poll a syllabus extraction proposal
      responses:
        '200':
          description: Current operation state, including the proposal once succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyllabusExtractionResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [syllabus]
      operationId: cancelSyllabusExtraction
      summary: Cancel a queued or running extraction
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyllabusExtractionResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/taxonomy/skills:
    get:
      tags: [taxonomy]
      operationId: searchTaxonomySkills
      summary: Search canonical skills for a human-reviewed picker
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Canonical results, best match first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomySearchResponse' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/course-maps/{course_map_version}:
    put:
      tags: [course-maps]
      operationId: publishApprovedCourseMap
      summary: Atomically install one complete Java-approved course map
      description: |
        Full replacement, never a delta. The same version and same canonical payload is
        idempotent; reusing a version for different bytes is a `409`. Every skill ID is validated
        against the current taxonomy. Only this approved representation enters student vectors.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: course_map_version
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishCourseMapRequest' }
      responses:
        '200':
          description: Published or confirmed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishCourseMapResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/career-paths:
    get:
      tags: [skill-gap]
      operationId: listCareerPaths
      summary: Career paths the ontology covers
      description: |
        **Budget: 1 s.** Synchronous, no model, no student.

        The nine paths and how much evidence stands behind each. `captured_at`
        is when the postings were collected, so a caller can date its own claim
        instead of hard-coding one.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Every career path with its sample size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerPathListResponse'
        '404':
          description: No ontology has been built.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/career-paths/skills:
    get:
      tags: [skill-gap]
      operationId: getCareerPathSkills
      summary: What one career path demands, with no student in it
      description: |
        **Budget: 2 s.** Synchronous, no model.

        Every other endpoint in this group needs a transcript first, which leaves
        a caller with nothing to show somebody who has not uploaded one. What a
        career asks for is answerable without knowing anything about them.

        Bands come from the same function `/skill-gap` uses, so a skill cannot
        read `critical` here and `important` there.

        The path name is a **query parameter, not a path segment**: two of the
        nine names contain a slash ("UI/UX Design"), and encoding that into a
        segment is normalised or rejected by enough proxies to be a real bug.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: career_path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: band
          in: query
          required: false
          description: Return only one band. Totals still describe the whole path.
          schema: { type: string, enum: [critical, important, useful] }
        - name: include_soft
          in: query
          required: false
          description: >-
            Soft skills top nearly every path, which is accurate and useless as
            advice. Set false to drop them.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: The path's requirements, most-demanded first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerPathSkillsResponse'
        '404':
          description: Unknown career path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/skill-vector:
    post:
      tags: [skill-gap]
      operationId: buildSkillVector
      summary: Compute the Student Skill Vector from confirmed courses (M2)
      description: |
        **Budget: 10 s.** Synchronous. Deterministic arithmetic — no model is involved, so the
        same transcript and course-skill map always produce the same numbers.

        Stateless: the caller sends the confirmed transcript rows every time. This service holds
        no students.

        `quiz_scores` folds graded quiz evidence into the vector, replacing the grade-inferred
        proficiency for those skills. Scores are fractions in `0.0..1.0`. A percentage such as
        `85` is rejected with `422` rather than silently clamped to `1.0` — that clamp would
        turn a failing student into a perfect one with no signal.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillVectorRequest'
      responses:
        '200':
          description: The computed vector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillVectorResponse'
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/skill-gap:
    post:
      tags: [skill-gap]
      operationId: buildSkillGap
      summary: Compare the vector against a career path's requirements (M3)
      description: |
        **Budget: 10 s.** Synchronous.

        Every number is computed arithmetically. `narrative` is the only generated field; it is
        off by default because it costs an LLM call, and it explains numbers that are already
        final — it can never change one. If the model is unavailable the gap is still returned
        complete with `narrative: null` rather than failing.

        Readiness is not a field. Compute it from `requirements_met / total_requirements`; the
        caller owns how that is presented.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillGapRequest'
      responses:
        '200':
          description: The gap analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillGapResponse'
        '404':
          description: Unknown `career_path`. The problem body lists the names that do exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/recommendations:
    post:
      tags: [recommendations]
      operationId: recommendCourses
      summary: Grounded, ranked courses that close the student's gaps (M4)
      description: |
        **Target: 5 s.** Synchronous.

        Items are **retrieved from a real catalog and re-ranked, never generated**, so this
        cannot invent a course and every item carries a working `url`.

        An empty catalog answers `503`, not an empty list: "nothing ingested" and "no gaps to
        close" are different answers and the caller must not show them the same way. Gaps the
        catalog cannot serve come back in `skills_without_courses` rather than being dropped.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Ranked recommendations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/quizzes:
    post:
      tags: [quiz]
      operationId: generateQuiz
      summary: Generate a validated multiple-choice quiz for one skill (M5)
      description: |
        **Budget: 15 s.** Synchronous.

        Keyed by canonical `skill_id`, never by course name. A course teaches many skills and a
        skill is taught by many courses, so a course-named quiz cannot be written back to a
        skill unambiguously.

        Returns the questions **and** the `answer_key`. The caller stores both, shows the
        student only `questions`, and grades the submission itself — grading is arithmetic and
        needs no model. It then feeds the resulting score back through `POST /api/v1/skill-vector`
        as `quiz_scores`. Holding the key here would give this service user-scoped state it has
        nowhere else; the key never reaches a browser because this is server-to-server.

        Unlike the gap narrative, an unavailable model is fatal here: there is no partial quiz
        worth returning, so this answers `503`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizRequest'
      responses:
        '201':
          description: The generated quiz and its answer key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '404':
          description: '`skill_id` is not in the taxonomy.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/mentor-matches:
    post:
      tags: [matching]
      operationId: matchMentors
      summary: Rank supplied mentors against one student's skill gap (M6)
      description: |
        **Budget: 10 s.** Synchronous. Deterministic — no model is involved, and the same
        request always produces the same ranking.

        Mentors are ranked against what the student is **missing**, not what they already
        know: a mentor matched to a strength is the one who can teach them least. Weighting is
        by `priority`, so a mentor covering a small shortfall the market asks for constantly
        outranks one covering a large shortfall almost nobody hires for.

        The caller supplies the mentors — already filtered for status and authorisation — and
        no id can come back that did not go in. This service stores no mentor records.

        **Read `signal` on every item before displaying it.** `stated` means the mentor's own
        `expertise_terms` resolved onto the taxonomy. `inferred` means only a study field was
        available and a career path stood in for it — that must never be shown to a student as
        though the mentor had claimed the skill. `none` means neither was usable and the
        mentor was ranked on experience alone.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorMatchRequest'
      responses:
        '200':
          description: Mentors ranked best-first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorMatchResponse'
        '404':
          description: Unknown `career_path`. The problem body lists the names that do exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

components:

  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: |
        A shared service token (ADR-004). Sent by the Java backend as
        `Authorization: Bearer <token>`. This authenticates the *service*, not a student — no
        end-user identity crosses this boundary. Production additionally requires TLS and
        network policy; mTLS may replace the token later without changing any payload.

        **Enforced since v1.1.0.** The service reads `CC_SERVICE_TOKEN`; when it is set, every
        `/api/v1/*` request except health must carry that token or receive `401`. Leaving it
        unset disables the check, which is intended for loopback development only and is
        logged as a warning at startup. Health stays open in both cases so that a readiness
        probe cannot be mistaken for an unhealthy container.

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Propagated onto every log line on both sides and echoed in problem responses, so one
        student-visible failure can be followed across both runtimes. The caller generates it.
      schema:
        type: string
        maxLength: 128

  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:

    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Every error on this API uses this shape.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A stable machine-readable slug, e.g. `career-path-not-found`.
          example: career-path-not-found
        title:
          type: string
          example: Unknown career path
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: Human-readable specifics. Safe to log; never contains student PII.
        errors:
          type: array
          description: Field-level validation failures, present on 422.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        known:
          type: array
          description: On `career-path-not-found`, the names that do exist.
          items: { type: string }

    CanonicalTranscriptCourse:
      type: object
      description: |
        One parsed transcript row, shaped for review. The deterministic parser does not compute
        a probability per row, so `confidence` is normally null; concrete anomalies are carried
        in `warnings` and set `low_confidence`. A null `confidence` must not be rendered as
        zero confidence, and `low_confidence` must not be read as a numeric score.
      required: [course_code, course_name]
      properties:
        course_code:
          type: string
          maxLength: 20
          description: The deterministic join key to the course-skill map. Never dropped.
        course_name: { type: string, maxLength: 200 }
        grade: { type: string, maxLength: 8, nullable: true }
        confidence: { type: number, format: double, minimum: 0.0, maximum: 1.0, nullable: true }
        low_confidence:
          type: boolean
          default: false
          description: True when an extraction anomaly means a human should look at this row.
        warnings:
          type: array
          items: { type: string }

    TranscriptParseResponse:
      type: object
      required: [content_sha256, source_file, courses]
      properties:
        content_sha256:
          type: string
          description: Hash of the uploaded bytes, for idempotency and audit.
        source_file: { type: string }
        student:
          type: object
          description: Whatever identifying header the parser could read. Advisory only.
        summary:
          type: object
          description: Counts and grade distribution.
        categories:
          type: array
          items: { type: object }
        courses:
          type: array
          description: The canonical typed rows. Bind to this.
          items:
            $ref: '#/components/schemas/CanonicalTranscriptCourse'
        all_courses:
          type: array
          description: Deprecated untyped view, retained during migration. Do not bind.
          deprecated: true
          items: { type: object }
        saved_to:
          type: string
          nullable: true
          description: Null unless `save=true` was requested. Always null for service calls.

    TranscriptCourse:
      type: object
      description: |
        One confirmed transcript row supplied by the caller. `course_codes` carries every code
        the course is known by: plan editions renumber, so a transcript quoting `0433301` must
        still join to a skill map holding `A0413301` for the same course.
      required: [course_code]
      properties:
        course_code: { type: string, minLength: 1, maxLength: 20 }
        course_codes:
          type: array
          maxItems: 8
          items: { type: string }
        course_name: { type: string, maxLength: 200, nullable: true }
        grade: { type: string, maxLength: 8, nullable: true }
        status: { type: string, maxLength: 30, nullable: true }
        credit_hours: { type: integer, minimum: 0, maximum: 20, nullable: true }

    ExtractionProgress:
      type: object
      required: [stage, terms_total, terms_resolved, elapsed_seconds]
      properties:
        stage:
          type: string
          enum: [queued, parsing, extracting, matching, storing, done]
        terms_total: { type: integer, minimum: 0 }
        terms_resolved: { type: integer, minimum: 0 }
        elapsed_seconds: { type: number, format: double, minimum: 0 }

    SkillCandidate:
      type: object
      required: [id, label, score]
      properties:
        id: { type: string }
        label: { type: string }
        score: { type: number, format: double, minimum: 0.0, maximum: 1.0 }

    ExtractedSkillMatch:
      type: object
      properties:
        original_term: { type: string }
        canonical_id: { type: string, nullable: true }
        canonical_label: { type: string, nullable: true }
        taxonomy: { type: string, nullable: true }
        taxonomy_version: { type: string, nullable: true }
        match_method: { type: string, nullable: true }
        match_score: { type: number, format: double, minimum: 0.0, maximum: 1.0, nullable: true }
        review_status: { type: string, enum: [accepted, needs_review, no_match] }
        reason: { type: string, nullable: true }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/SkillCandidate' }

    ExtractedCourseSkill:
      type: object
      required: [term, level, weight, evidence_count, sources]
      properties:
        term: { type: string }
        canonical:
          type: object
          nullable: true
          properties:
            id: { type: string }
            label: { type: string }
            taxonomy: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        weight: { type: number, format: double, minimum: 0.0, maximum: 1.0 }
        evidence_count: { type: integer, minimum: 0 }
        sources:
          type: array
          items: { type: string }
        evidence:
          type: array
          items: { type: object, additionalProperties: true }
        match: { $ref: '#/components/schemas/ExtractedSkillMatch' }

    SyllabusExtractionResult:
      type: object
      required: [course_code, total_skills, skills]
      properties:
        course_code: { type: string }
        total_skills: { type: integer, minimum: 0 }
        taxonomy_version: { type: string, nullable: true }
        skills:
          type: array
          items: { $ref: '#/components/schemas/ExtractedCourseSkill' }

    SyllabusExtractionResponse:
      type: object
      required: [extraction_id, status, content_sha256, progress]
      properties:
        extraction_id: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        course_code: { type: string, nullable: true }
        content_sha256: { type: string }
        degraded: { type: boolean, default: false }
        progress: { $ref: '#/components/schemas/ExtractionProgress' }
        result:
          allOf: [{ $ref: '#/components/schemas/SyllabusExtractionResult' }]
          nullable: true
        warnings:
          type: array
          items: { type: string }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    TaxonomySkill:
      type: object
      required: [skill_id, label, source, skill_type, taxonomy_version]
      properties:
        skill_id: { type: string }
        label: { type: string }
        skill_type: { type: string }
        source: { type: string }
        description: { type: string, nullable: true }
        taxonomy_version: { type: string }

    TaxonomySearchResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/TaxonomySkill' }

    ApprovedCourseSkill:
      type: object
      required: [skill_id, term, level, weight, evidence_count, sources]
      properties:
        skill_id: { type: string, minLength: 1, maxLength: 120 }
        skill_label: { type: string, nullable: true }
        term: { type: string, minLength: 1, maxLength: 300 }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        weight: { type: number, format: double, minimum: 0.0, maximum: 1.0 }
        evidence_count: { type: integer, minimum: 0 }
        sources:
          type: array
          items: { type: string }
        evidence:
          type: array
          items: { type: object, additionalProperties: true }

    PublishCourseMapRequest:
      type: object
      required: [institution_code, catalog_version, course_code, source_outcome_id, taxonomy_version, skills]
      properties:
        institution_code: { type: string, minLength: 1, maxLength: 120 }
        catalog_version: { type: string, minLength: 1, maxLength: 80 }
        course_code: { type: string, minLength: 1, maxLength: 64 }
        source_outcome_id: { type: string, minLength: 1, maxLength: 120 }
        taxonomy_version: { type: string, minLength: 1, maxLength: 120 }
        skills:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/ApprovedCourseSkill' }

    PublishCourseMapResponse:
      type: object
      required: [course_map_version, course_key, course_code, taxonomy_version, total_skills, content_sha256, published_at, idempotent]
      properties:
        course_map_version: { type: string }
        course_key: { type: string }
        course_code: { type: string }
        taxonomy_version: { type: string }
        total_skills: { type: integer, minimum: 0 }
        content_sha256: { type: string }
        published_at: { type: string, format: date-time }
        idempotent: { type: boolean }

    SkillVectorRequest:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/TranscriptCourse'
        quiz_scores:
          type: object
          description: |
            Canonical `skill_id` to graded score. Values are fractions in `0.0..1.0`. An unknown
            id is a `404`, not a silently invented skill.
          additionalProperties:
            type: number
            format: double
            minimum: 0.0
            maximum: 1.0
        include_unpassed:
          type: boolean
          default: false
          description: Whether failed courses still contribute evidence.

    VectorCourseEvidence:
      type: object
      properties:
        course_code: { type: string }
        course_name: { type: string, nullable: true }
        grade: { type: string, nullable: true }
        weight: { type: number, format: double }
        level: { type: string, nullable: true }

    SkillVectorItem:
      type: object
      required: [skill_id, label, proficiency]
      properties:
        skill_id:
          type: string
          description: Canonical identity. The label is display text and must never be used as identity.
        label: { type: string }
        skill_type: { type: string, nullable: true }
        proficiency:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        coverage:
          type: number
          format: double
          description: May exceed 1.0 when several courses evidence the same skill.
        graded_coverage: { type: number, format: double }
        evidence:
          type: string
          nullable: true
          description: Where the proficiency came from, e.g. `grades` or `quiz`.
        course_count: { type: integer }
        courses:
          type: array
          items:
            $ref: '#/components/schemas/VectorCourseEvidence'
        quiz_score:
          type: number
          format: double
          nullable: true
          minimum: 0.0
          maximum: 1.0

    SkippedCourse:
      type: object
      description: |
        A course the vector could not use, and why. This is not noise: "the student never
        studied this" and "we could not see the course that teaches it" are different sentences,
        and without these the caller cannot tell them apart.
      properties:
        course_code: { type: string }
        reason:
          type: string
          description: e.g. `not passed`, `no skill map`.

    SkillVectorResponse:
      type: object
      required: [source, total_skills, courses_counted, skills]
      properties:
        taxonomy_version: { type: string, nullable: true }
        source: { type: string }
        total_skills: { type: integer }
        courses_counted: { type: integer }
        courses_skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedCourse'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillVectorItem'

    SkillGapRequest:
      allOf:
        - $ref: '#/components/schemas/SkillVectorRequest'
        - type: object
          required: [career_path]
          properties:
            career_path:
              type: string
              minLength: 1
              maxLength: 120
              description: |
                The career path **name**, never the caller's numeric id — neither service owns
                the other's identifiers. An unknown name answers `404` and lists the known ones.
            include_soft:
              type: boolean
              default: true
            narrative:
              type: boolean
              default: false
              description: Costs an LLM call. The gap is returned complete either way.

    CareerPathSummary:
      type: object
      required: [career_path, sample_size, total_skills]
      properties:
        career_path: { type: string }
        sample_size: { type: integer, description: Postings behind this path. }
        total_skills: { type: integer }

    CareerPathListResponse:
      type: object
      required: [total, career_paths]
      properties:
        total: { type: integer }
        derived_from: { type: string, nullable: true }
        captured_at:
          type: string
          nullable: true
          description: When the postings were collected, from the scrape report.
        career_paths:
          type: array
          items:
            $ref: '#/components/schemas/CareerPathSummary'

    CareerPathSkill:
      type: object
      required: [skill_id, label, coverage, demand_band]
      description: >-
        One requirement, and the evidence that it is one. Carries both the
        fraction and the count it came from: "39%" asks to be trusted, "72 of
        184 postings" shows its working.
      properties:
        skill_id: { type: string }
        label: { type: string }
        skill_type: { type: string, nullable: true }
        posting_count: { type: integer, nullable: true }
        coverage:
          type: number
          format: double
          description: Share of this path's postings asking for the skill, 0.0-1.0.
        demand_band:
          type: string
          enum: [critical, important, useful]
        required_level: { type: string, nullable: true }
        required_score: { type: number, format: double, nullable: true }
        sample_terms:
          type: array
          maxItems: 5
          description: A few of the phrases employers wrote that resolved to this skill.
          items: { type: string }

    CareerPathSkillsResponse:
      type: object
      required: [career_path, total, skills]
      properties:
        career_path: { type: string }
        sample_size: { type: integer, nullable: true }
        derived_from: { type: string, nullable: true }
        captured_at: { type: string, nullable: true }
        taxonomy_version: { type: string, nullable: true }
        total:
          type: integer
          description: Rows returned, after `band` and `include_soft` are applied.
        band_totals:
          type: object
          description: >-
            Rows per band across the whole path, counted before `band` filters —
            so a caller showing one band can still say how big the others are.
          additionalProperties: { type: integer }
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CareerPathSkill'

    SkillGapItem:
      type: object
      required: [skill_id, label, classification]
      properties:
        skill_id: { type: string }
        label: { type: string }
        skill_type: { type: string, nullable: true }
        required_level: { type: string, nullable: true }
        required_proficiency: { type: number, format: double, minimum: 0.0, maximum: 1.0 }
        current_level: { type: number, format: double, minimum: 0.0, maximum: 1.0 }
        evidence_coverage: { type: number, format: double }
        required_coverage: { type: number, format: double }
        gap: { type: number, format: double }
        classification:
          type: string
          enum: [strong, moderate, weak]
          description: Lower-case on the wire. The caller maps to its own display casing.
        importance: { type: number, format: double }
        demand_band:
          type: string
          enum: [critical, important, useful]
          description: >-
            `importance` bucketed into three learn-first bands: critical at or
            above 0.25, important from 0.10, useful below. Banded by the service
            rather than the caller so every consumer means the same thing by
            "critical".
        posting_count:
          type: integer
          nullable: true
          description: >-
            Postings that asked for this skill. The numerator under
            `importance`; `sample_size` on the response is the denominator.
        priority:
          type: number
          format: double
          description: Shortfall already weighted by market demand. Rank on this, not on `gap`.
        evidence: { type: string, nullable: true }
        course_count: { type: integer }
        courses:
          type: array
          items:
            $ref: '#/components/schemas/VectorCourseEvidence'

    SkillGapResponse:
      type: object
      required: [summary, total_requirements, requirements_met, skills]
      properties:
        career_path: { type: string, nullable: true }
        taxonomy_version: { type: string, nullable: true }
        source: { type: string, nullable: true }
        sample_size:
          type: integer
          nullable: true
          description: >-
            Job postings this path's requirements were derived from — the
            denominator behind every `importance`. Null when the ontology
            carries no header; the arithmetic is unaffected.
        captured_at:
          type: string
          nullable: true
          description: >-
            When the postings behind these requirements were collected, ISO-8601. Reported rather
            than hard-coded so a re-scrape moves the date a consumer shows.
        band_summary:
          type: object
          description: >-
            Classification counts split by `demand_band`, so a caller can report
            progress against what the market insists on rather than against every
            requirement. Keyed critical / important / useful, each carrying
            strong, moderate, weak and total. Honours `include_soft` exactly as
            `summary` does.
          additionalProperties:
            type: object
            properties:
              strong: { type: integer }
              moderate: { type: integer }
              weak: { type: integer }
              total: { type: integer }
        summary:
          type: object
          description: Counts per classification.
          properties:
            strong: { type: integer }
            moderate: { type: integer }
            weak: { type: integer }
        total_requirements: { type: integer }
        requirements_met: { type: integer }
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillGapItem'
        narrative: { type: string, nullable: true }
        courses_counted: { type: integer }
        synthetic_counted:
          type: integer
          description: >-
            Of `courses_counted`, how many rest on a synthetic syllabus rather than a real
            extracted one. Zero unless the demo corpus is enabled. A caller showing a profile
            built on these must say so: invented coursework presented as a real academic record
            is the one failure mode this field exists to prevent.
        courses_skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedCourse'

    RecommendationRequest:
      allOf:
        - $ref: '#/components/schemas/SkillGapRequest'
        - type: object
          properties:
            limit: { type: integer, default: 10, minimum: 1, maximum: 50 }
            platform:
              type: string
              nullable: true
              enum: [coursera, ocw, youtube]
            skill_id:
              type: string
              nullable: true
              maxLength: 120
              description: Narrow to a single skill.
            language: { type: string, default: en, maxLength: 10 }
            per_skill: { type: integer, default: 3, minimum: 1, maximum: 10 }
            include_soft: { type: boolean, default: false }

    RecommendedCourse:
      type: object
      required: [course_id, title, platform, url]
      properties:
        course_id: { type: string }
        title: { type: string }
        platform: { type: string }
        url:
          type: string
          format: uri
          description: Never empty. This is the one output a student clicks rather than reads.
        level: { type: string, nullable: true }
        language: { type: string, nullable: true }
        duration_hours: { type: number, format: double, nullable: true }
        rating: { type: number, format: double, nullable: true }

    RecommendationItem:
      type: object
      required: [skill_id, course, relevance, explanation]
      properties:
        skill_id: { type: string }
        skill_label: { type: string, nullable: true }
        course:
          $ref: '#/components/schemas/RecommendedCourse'
        relevance:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: |
            Retrieval score. The caller may apply its own threshold, but must not present this
            as a percentage without saying what it measures.
        matched_in_title: { type: boolean }
        explanation:
          type: string
          description: |
            Written from the student's own gap, never from the course description — the
            platforms' catalog text is not licensed for republication.

    UnservedSkill:
      type: object
      description: A gap the catalog cannot currently serve. Carries the label because the caller has no taxonomy to resolve the id against.
      required: [skill_id]
      properties:
        skill_id: { type: string }
        skill_label: { type: string, nullable: true }

    RecommendationResponse:
      type: object
      required: [total, items]
      properties:
        career_path: { type: string, nullable: true }
        total: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        skills_without_courses:
          type: array
          items:
            $ref: '#/components/schemas/UnservedSkill'
        courses_counted: { type: integer }
        courses_skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedCourse'

    QuizRequest:
      type: object
      required: [skill_id]
      properties:
        skill_id:
          type: string
          minLength: 1
          maxLength: 120
          description: Canonical taxonomy id. Not a course name.
        question_count:
          type: integer
          default: 5
          minimum: 1
          maximum: 10
          description: |
            Capped because inference is serialised — an unbounded count is an accidental denial
            of service against every other caller.
        verify:
          type: boolean
          default: true
          description: Run the generated questions back through validation before returning.

    QuizQuestion:
      type: object
      required: [question_id, question, options]
      properties:
        question_id:
          type: string
          description: Stable within this quiz, e.g. `q1`. The answer key is keyed by it.
        question: { type: string }
        options:
          type: array
          minItems: 2
          items: { type: string }

    QuizAnswer:
      type: object
      required: [correct_index, correct_answer]
      properties:
        correct_index:
          type: integer
          minimum: 0
          description: |
            **Zero-based** index into that question's `options`. Exactly one option is correct
            (NFR-AI-07). A caller using A/B/C/D letters must convert explicitly; an off-by-one
            here silently grades every attempt wrongly.
        correct_answer:
          type: string
          description: The option text, so the caller can verify the index resolves as expected.
        explanation: { type: string }

    QuizResponse:
      type: object
      required: [question_count, questions, answer_key]
      properties:
        skill_id: { type: string, nullable: true }
        skill_label: { type: string, nullable: true }
        question_count: { type: integer }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
        answer_key:
          type: object
          description: Keyed by `question_id`. Server-to-server only — never forward to a browser.
          additionalProperties:
            $ref: '#/components/schemas/QuizAnswer'
        warnings:
          type: array
          items: { type: string }

    Mentor:
      type: object
      description: |
        One mentor to rank. The caller owns mentor records; this service holds none and
        supplies nothing of its own.

        `expertise_terms` is optional but is the only strong signal. Without it the ranking
        falls back to what the study field implies, which is broad, capped, and reported as
        `inferred` in the response.
      required: [mentor_id]
      properties:
        mentor_id:
          type: string
          minLength: 1
          maxLength: 120
          description: Opaque, caller-owned. Never a database-local integer.
        study_field:
          type: string
          nullable: true
          maxLength: 120
          description: |
            Matched case-insensitively against a reviewed study-field to career-path mapping.
            A field absent from that mapping attributes no skills at all rather than guessing.
        field_starting_year:
          type: integer
          nullable: true
          minimum: 1950
          maximum: 2100
          description: Used for years of experience, which is capped so it cannot outweigh relevance.
        expertise_terms:
          type: array
          maxItems: 20
          description: |
            Free text, resolved onto canonical skills by the same matcher the syllabus
            pipeline uses. Only confidently-resolved terms count — an uncertain match must not
            become a claim that a mentor knows a skill.
          items: { type: string }

    MentorMatchRequest:
      allOf:
        - $ref: '#/components/schemas/SkillGapRequest'
        - type: object
          required: [mentors]
          properties:
            mentors:
              type: array
              minItems: 1
              maxItems: 200
              description: '`mentor_id` must be unique; a repeat is a 422, not a duplicate row.'
              items:
                $ref: '#/components/schemas/Mentor'
            limit:
              type: integer
              default: 10
              minimum: 1
              maximum: 50

    AlignedSkill:
      type: object
      description: A gap of the student's that this mentor could help close.
      required: [skill_id]
      properties:
        skill_id: { type: string }
        skill_label: { type: string, nullable: true }

    MentorMatchItem:
      type: object
      required: [mentor_id, score, signal, aligned_skills, gaps_addressed, years_experience, explanation]
      properties:
        mentor_id: { type: string }
        score:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        signal:
          type: string
          enum: [stated, inferred, none]
          description: |
            What the ranking was built from, and the field that decides how this may be
            presented. `stated` — the mentor's own expertise resolved onto the taxonomy.
            `inferred` — only a study field was available; do not show this to a student as a
            claim the mentor made. `none` — neither was usable; experience only.
        aligned_skills:
          type: array
          description: The student's highest-priority gaps this mentor covers, most valuable first.
          items:
            $ref: '#/components/schemas/AlignedSkill'
        gaps_addressed:
          type: integer
          description: |
            Total open gaps this mentor touches, including ones outside the scored set.
            Context for the reader; the score is built from `aligned_skills`.
        years_experience: { type: integer }
        explanation:
          type: string
          description: Written from the student's own gap, never from mentor-supplied prose.

    MentorMatchResponse:
      type: object
      required: [total, gaps_considered, items]
      properties:
        career_path: { type: string, nullable: true }
        taxonomy_version: { type: string, nullable: true }
        total:
          type: integer
          description: Mentors scored, before `limit` truncated the list.
        gaps_considered:
          type: integer
          description: |
            How many of the student's highest-priority gaps the ranking scored against.
            Scoring against every open requirement sounds fairer and is not — with around a
            hundred of them, a mentor genuinely covering three would score 3%.
        items:
          type: array
          items:
            $ref: '#/components/schemas/MentorMatchItem'
