spring:
  datasource:
    url: jdbc:h2:mem:careercompass;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # Flyway owns every schema change. Hibernate only verifies that entities and migrations
      # still agree, so local H2 cannot silently drift away from production MySQL.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.careercompass: DEBUG
    org.springframework.security: DEBUG
