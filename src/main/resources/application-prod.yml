spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careercompass?useSSL=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema must already exist in prod; never auto-generate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.careercompass: INFO
    org.springframework.security: WARN
