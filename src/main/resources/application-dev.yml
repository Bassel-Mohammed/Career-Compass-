spring:
  datasource:
    url: jdbc:h2:mem:careercompass;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update   # convenient for local dev; use validate/none once schema is stable
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.careercompass: DEBUG
    org.springframework.security: DEBUG
